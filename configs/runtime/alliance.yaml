# Override reference for Alliance clusters. Shell launchers place paths on scratch.
runtime:
  device: auto
  seed: 360
  deterministic: true
  num_workers: 4
  log_every: 10
  offline: true
  resume: auto
  checkpoint_on_signal: true
  max_steps_this_job: 250
  walltime: "01:55:00"
  signal_seconds_before_end: 300
